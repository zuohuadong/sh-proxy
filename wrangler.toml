name = "sh-proxy"
main = "src/worker.js"
compatibility_date = "2024-01-01"

# Cloudflare Worker configuration
# Note: It's recommended to use environment variables or wrangler login instead of hardcoding credentials
# You can set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ZONE_ID as environment variables

[env.production]
name = "sh-proxy"
routes = [
  "sh-proxy.izm.cool/*"
]

[env.dev]
name = "sh-proxy-dev"
