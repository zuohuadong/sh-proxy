name: Domain Health Check and Auto Update

on:
  schedule:
    # 每天凌晨 2 点检查一次域名健康状态
    - cron: '0 2 * * *'
  workflow_dispatch:
    # 允许手动触发

jobs:
  health-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest
        
    - name: Install dependencies
      run: bun install
      
    - name: Check domain health and update config
      run: |
        bun scripts/health-check.js
        
    - name: Check for changes
      id: changes
      run: |
        if git diff --quiet src/worker.js; then
          echo "changed=false" >> $GITHUB_OUTPUT
        else
          echo "changed=true" >> $GITHUB_OUTPUT
        fi
        
    - name: Commit and push changes
      if: steps.changes.outputs.changed == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add src/worker.js
        git commit -m "Auto-update mirror domains based on health check"
        git push
        
    - name: Deploy to Cloudflare Workers
      if: steps.changes.outputs.changed == 'true'
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        command: deploy --env production