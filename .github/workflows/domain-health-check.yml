name: Domain Health Check and Auto Update

on:
  schedule:
    # 每天凌晨 2 点检查一次域名健康状态
    - cron: '0 2 * * *'
  workflow_dispatch:
    # 允许手动触发

jobs:
  health-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest
        
    - name: Install dependencies
      run: bun install
      
    - name: Check domain health and update config
      run: |
        echo "🔍 Starting health check for all mirror domains..."
        bun scripts/health-check.js

    - name: Generate health check report
      run: |
        echo "📊 Health Check Summary"
        echo "======================="
        echo ""
        echo "🐳 DockerHub Mirror Status:"
        echo "  - docker.io mirrors checked"
        echo "  - registry-1.docker.io mirrors checked"
        echo "  - index.docker.io mirrors checked"
        echo "  - registry.hub.docker.com mirrors checked"
        echo ""
        echo "ℹ️  Check the logs above for detailed results"

    - name: Show DockerHub configuration
      run: |
        echo ""
        echo "🐳 Current DockerHub Mirror Configuration:"
        echo "=========================================="
        echo ""
        echo "📦 docker.io:"
        grep -A 20 "'docker.io':" src/worker.js | grep -E "(primary|fallback)" || echo "  Configuration not found"
        echo ""
        echo "📦 registry-1.docker.io:"
        grep -A 10 "'registry-1.docker.io':" src/worker.js | grep -E "(primary|fallback)" || echo "  Configuration not found"
        echo ""
        echo "📦 index.docker.io:"
        grep -A 10 "'index.docker.io':" src/worker.js | grep -E "(primary|fallback)" || echo "  Configuration not found"
        echo ""
        echo "📦 registry.hub.docker.com:"
        grep -A 10 "'registry.hub.docker.com':" src/worker.js | grep -E "(primary|fallback)" || echo "  Configuration not found"

    - name: Check for changes
      id: changes
      run: |
        if git diff --quiet src/worker.js; then
          echo "changed=false" >> $GITHUB_OUTPUT
          echo "✅ No changes needed - all mirrors are healthy"
        else
          echo "changed=true" >> $GITHUB_OUTPUT
          echo "🔄 Configuration changes detected - will commit and deploy"
        fi
        
    - name: Commit and push changes
      if: steps.changes.outputs.changed == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add src/worker.js
        git commit -m "Auto-update mirror domains based on health check (including DockerHub mirrors)"
        git push
        
    - name: Deploy to Cloudflare Workers
      if: steps.changes.outputs.changed == 'true'
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        command: deploy --env production